# Copy to inventory.ini and replace with your own hosts.
# inventory.ini is git-ignored; this example is committed.

[gateway]
gateway.example.ts.net    ansible_user=ansible

[mcp]
mcp-host.example.ts.net   ansible_user=ansible

# llama-server host: configured by hand (see docs), listed here for reference / ad-hoc commands
[llm]
llm-host.example.ts.net   ansible_user=ansible

[all:vars]
ansible_python_interpreter=/usr/bin/python3
